# Settings for ASAv integration tests: ./parallel-test --settings settings/asav.yml ...
#
# plugin: added to every test with --plugin
# set:    dotted topology keys, passed to netlab create as -s key=value
#         * scalars only, no '=' in keys or values
#         * the node name in nodes.X... may be a wildcard: nodes.dut*... applies to every
#           matching node (dut, dut_a, dut2, ...); tests without a matching node skip the setting
plugin: [ files ]
set:
  defaults.device: asav
  # defaults.devices.asav.clab.image: vrnetlab/cisco_asav:9-18-1 # does not support Loopback
  defaults.devices.asav.clab.image: vrnetlab/cisco_asav:9-20-2-2
  # defaults.devices.asav.clab.image: vrnetlab/cisco_asav:9-24-1
  defaults.providers.clab.healthy_timeout: 1400 # wait for the container to become healthy
  defaults.providers.clab.ssh_timeout: 600 # wait for SSH to become available
  nodes.dut.loopback: true
  # ASAv drops traffic between interfaces with the same security level by default
  nodes.dut*.config.inline: |
    same-security-traffic permit inter-interface
